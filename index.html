<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title></title>
</head>
<body>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => {
        location.href = 'files.zip';
      })
      .catch(err => {
        console.error('SW registration failed:', err);
      });
  }
</script>
</body>
</html>
